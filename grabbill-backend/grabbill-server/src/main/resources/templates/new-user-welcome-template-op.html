<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title></title>
</head>
<body>
    <div>
        <p style="margin-bottom:2cm;">
            <img src='{{ companyLogo }}' />
        </p>
    </div>
    <div>
        <h2 style="margin-bottom:1cm;">New user account is created</h2>
    </div>

    <div style="margin-top: 10px">Hello {{ name }},</div>
        <br>
    <div>Your new user account details are as below:</div>
        <br/>
    <div><span><b>username : {{ username }}</b></span></div>
        <br/>
    <div><span><b>password : {{ password }}</b></span></div>
        <br>
    <div>If you have any issues or need further assistance, please contact us at {{ contactEmail }}</div>
        <br><br><br>
    <div>Thank you,</div>
        <br>
    <div>{{ companyName }} Team</div>
</body>
</html>
