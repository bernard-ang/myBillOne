# Data Source
spring.datasource.url=jdbc:mariadb://localhost:3307/grabbill?useSSL=false
spring.datasource.username=grabbill.root
spring.datasource.password=test12345
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.quartz.jdbc.initialize-schema=always
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Logging
logging.level.com.grabbill=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Mock Firebase
firebase.service-account.filename=firebase-mock.json

# 2FA
2fa.email.otp.ttl-seconds=300
2fa.auth-session.ttl-seconds=300

# Mail
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=grabbill.root
spring.rabbitmq.password=test12345

# Storage (Minio)
storage.url=http://localhost:9000
storage.access-key=grabbill.root
storage.secret-key=test12345
storage.bucket=grabbill

# WhatsApp Event
whatsapp-event.process-interval.cron=0 */5 * * * *
whatsapp-event.process-interval.timezone=UTC

# Job Scheduler
job.scheduler.enabled=true
job.scheduler.immediate-rate=60000
job.scheduler.schedule-rate=60000

# Security (CORS)
security.cors.allowed-origin=http://localhost:4800,http://localhost:4801,http://localhost:4802,https://www.grabbill.localhost,https://app.grabbill.localhost,https://admin.grabbill.localhost

# Stripe Payment (Test Mode - use sk_test_xxx from your Stripe dashboard)
payment.stripe.mode=test
payment.stripe.api.key.test=sk_test_placeholder
payment.stripe.api.key.live=sk_live_placeholder