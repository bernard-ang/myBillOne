<div container class="mx-auto" *ngIf="user$ | async as user">
  <div class="flex pb-8">
    <grabbill-client-page-header
      title="Search Records"
      description="Search records in different domains (digital filing / transactional email / email campaign / whatsapp / sms)"
    >
    </grabbill-client-page-header>
  </div>

  <div>
    <div class="flex">
      <nz-select
        nzPlaceHolder="Select Domain"
        class="type-select w-1/3"
        nzSize="large"
        [formControl]="domain"
        (ngModelChange)="doDomainChange($event)"
      >
        <nz-option
          *ngFor="let domain of getDomainTypeOptions(user)"
          [nzValue]="domain"
          [nzLabel]="getDomainLabel(domain)"
        ></nz-option>
      </nz-select>
      <nz-select
        nzPlaceHolder="Select Type"
        class="activity-type-select flex-grow"
        nzSize="large"
        nzShowSearch
        nzServerSearch
        [formControl]="type"
        (ngModelChange)="doTypeChange($event)"
        (nzOnSearch)="doSearchType($event)"
      >
        <ng-container *ngFor="let option of typeOptions">
          <nz-option *ngIf="!isLoading" [nzValue]="option.id" [nzLabel]="option.name"></nz-option>
        </ng-container>
        <nz-option *ngIf="isLoading" nzDisabled nzCustomContent>
          <i nz-icon nzType="loading" class="loading-icon"></i>
          Loading Data...
        </nz-option>
      </nz-select>
    </div>
    <ng-template #elseBlock>
      <nz-empty class="bg-white" empty-search [nzNotFoundContent]="contentTpl">
        <ng-template #contentTpl>
          <span>Select domain and type to perform record search</span>
        </ng-template>
      </nz-empty>
    </ng-template>
    <ng-container *ngIf="currentType && currentDomain; else elseBlock">
      <grabbill-client-index-row-filter-table
        [type]="currentType"
        [domainType]="currentDomain"
        [contactFields]="contactFields"
        [loading]="isTableLoading"
        (loadingChange)="handleLoadingChange($event)"
      >
      </grabbill-client-index-row-filter-table>
    </ng-container>
  </div>
</div>
