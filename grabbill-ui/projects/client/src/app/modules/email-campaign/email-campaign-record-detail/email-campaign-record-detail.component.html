<ng-container>
  <ng-container>
    <div container class="mx-auto">
      <grabbill-client-breadcrumb
        rootTitle="Email Campaign"
        [rootLink]="['/', 'email-campaign', 'list']"
        [hasCrumb2]="true"
        [crumb2Object]="emailCampaignType$ | async"
        [crumb2Link]="['/', 'email-campaign', 'detail', typeId]"
        [crumb2QueryParam]="{ tab: 'activities' }"
        [hasCrumb3]="true"
        [crumb3Object]="emailCampaignActivity$ | async"
        [crumb3Link]="['/', 'email-campaign', 'detail', typeId, 'activity', activityId]"
        [crumb3QueryParam]="{ tab: 'records' }"
      ></grabbill-client-breadcrumb>

      <ng-template #elseRecord>
        <div nz-list nzBordered>
          <div nz-list-item>
            <nz-skeleton [nzAvatar]="true" [nzActive]="true" [nzParagraph]="{ rows: 1 }"></nz-skeleton>
          </div>
        </div>
      </ng-template>

      <ng-container *ngIf="record; else elseRecord">
        <ng-container *ngIf="emailCampaignActivity$ | async as emailCampaignActivity">
          <ng-container *ngIf="emailCampaignType$ | async as emailCampaignType">
            <div class="mb-4">
              <grabbill-client-page-header [title]="record.name"></grabbill-client-page-header>
            </div>

            <nz-tabset nzSize="large">
              <nz-tab nzTitle="Overview">
                <nz-card>
                  <grabbill-client-descriptions
                    title="Email Status"
                    [items]="[
                    { span: 2, title: 'Email Sent', value: record.emailStatusSent, type: 'boolean' },
                    { span: 2, title: 'Processed Timestamp', value: record.processedTimestamp, type: 'date' },
                    { span: 2, title: 'Email Bounced Skip', value: record.emailStatusSkipBounced, type: 'boolean' },
                    { span: 2, title: 'Email Unsubscribed Skip', value: record.emailStatusSkipUnsubscribed, type: 'boolean' },
                    { span: 2, title: 'Email Hard Bounced', value: record.emailStatusHardBounce, type: 'boolean' },
                    { span: 2, title: 'Email Soft Bounced', value: record.emailStatusSoftBounce, type: 'boolean' },
                    { span: 2, title: 'Delivery Status Notification', value: record.emailDsnReceivedConfirmation, type: 'boolean' },
                    { span: 2, title: 'Delivery Status Notification Processed Timestamp', value: record.dsnProcessedTimestamp, type: 'date' },
                    { span: 4, title: 'Delivery Status Notification', value: record.emailDsnMessage, type: 'pre' },
                    { span: 2, title: 'Email Open', value: record.emailStatusUserReadTimestamp, type: 'boolean' },
                    { span: 2, title: 'Email Open Timestamp', value: record.emailStatusUserReadTimestamp, type: 'date' },
                    { span: 2, title: 'Email Unsubscribed Timestamp', value: record.emailStatusUnsubscribedTimestamp, type: 'date' },
                    { span: 2, title: 'Unsubscribe Reason', value: record.emailStatusUnsubscribedReason, type: 'string' },
                  ]"
                  >
                  </grabbill-client-descriptions>

                  <grabbill-client-descriptions
                    title="Email Status"
                    containerClass=""
                    [items]="[
                    { span: 2, title: 'Status', value: record.status, type: 'tag', typeFn: getStatusTag, object: record.status },
                    { span: 2, title: 'Message', value: record.message, type: 'string' },
                    { span: 2, title: 'Retry count', value: record.retryCount, type: 'string' },
                  ]"
                  >
                  </grabbill-client-descriptions>
                </nz-card>
              </nz-tab>

              <nz-tab nzTitle="Email Content">
                <nz-card>
                  <grabbill-client-descriptions
                    title="Email"
                    containerClass=""
                    [items]="[
                    { span: 2, title: 'From Email', value: emailCampaignActivity.emailFrom, type: 'string' },
                    { span: 2, title: 'From Name', value: emailCampaignActivity.emailFromName, type: 'string' },
                    { span: 4, title: 'Subject', value: emailCampaignActivity.emailSubject, type: 'string' },
                    { span: 4, title: 'Content', value: record.emailContent, type: 'html' },
                    { span: 4, title: 'Content', value: emailCampaignActivity.files, type: 'files', typeFn: doDownloadFile, object: this },
                  ]"
                  >
                  </grabbill-client-descriptions>
                </nz-card>
              </nz-tab>
            </nz-tabset>
          </ng-container>
        </ng-container>
      </ng-container>
    </div>
  </ng-container>
</ng-container>
